<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UMortgage AI Tech</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap');

:root {
  --um-blue: #1b3f6e;
  --um-blue-mid: #1e4d87;
  --um-teal: #00c6b8;
  --um-teal-dim: #00a89b;
  --um-gold: #f0a500;
  --navy: #0d1b2e;
  --navy-card: #132035;
  --navy-border: #1c3250;
  --sidebar-w: 230px;
  --text: #f0f4f8;
  --muted: #7a9ab8;
  --faint: #2a4060;
  --red: #c0392b;
  --amber: #e07b00;
  --green: #1a7a4a;
  --yellow: #f5c518;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--navy);
  color: var(--text);
  height: 100vh;
  display: flex;
}

/* ── SIDEBAR ───────────────────────────────────────── */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0a1520 0%, #0d1b2e 100%);
  border-right: 1px solid var(--navy-border);
  display: flex;
  flex-direction: column;
  z-index: 200;
  overflow: hidden;
}

.sidebar::before {
  content: '';
  position: absolute;
  top: -60px; left: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(0,198,184,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--navy-border);
  position: relative;
}

.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--um-teal), var(--um-blue-mid));
  border-radius: 6px;
  padding: 3px 8px;
  margin-bottom: 8px;
}

.logo-badge span {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
}

.logo-pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.sidebar-title {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.sidebar-title .ai {
  background: linear-gradient(135deg, var(--um-teal), #4db8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.03em;
}

/* NAV */
.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  overflow-y: auto;
}

.nav-section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 0 10px;
  margin: 14px 0 6px;
}

.nav-section-label:first-child { margin-top: 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 1px;
  text-decoration: none;
  position: relative;
  user-select: none;
}

.nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

.nav-item.active {
  background: rgba(0,198,184,0.1);
  color: var(--um-teal);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: var(--um-teal);
  border-radius: 0 3px 3px 0;
}

.nav-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label-text { flex: 1; }

.beta-pill {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: rgba(42,125,225,0.18);
  color: #4db8ff;
  border-radius: 4px;
  padding: 1px 5px;
  text-transform: uppercase;
}

.nav-divider {
  height: 1px;
  background: var(--navy-border);
  margin: 10px 10px;
}

/* SIDEBAR FOOTER */
.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--navy-border);
}

.footer-credit {
  font-size: 10px;
  color: var(--faint);
  cursor: pointer;
  transition: color 0.15s;
  text-decoration: none;
  display: block;
}

.footer-credit:hover { color: var(--um-teal); }

/* ── MAIN AREA ─────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: linear-gradient(135deg, var(--um-blue) 0%, var(--navy) 100%);
  border-bottom: 1px solid var(--navy-border);
  padding: 0 28px;
  height: 52px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  flex-shrink: 0;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-page-title {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.01em;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-badge {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 3px 11px;
}

/* ── IFRAME PAGES ──────────────────────────────────── */
.iframe-container {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.iframe-container iframe,
.content-page iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ── BETA / COMING SOON PAGE ───────────────────────── */
.placeholder-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 60px;
  text-align: center;
}

.placeholder-icon { font-size: 48px; margin-bottom: 8px; }

.placeholder-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}

.placeholder-sub {
  font-size: 14px;
  color: var(--muted);
  max-width: 400px;
  line-height: 1.6;
}

.beta-badge-big {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(42,125,225,0.15);
  border: 1px solid rgba(77,184,255,0.3);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  color: #4db8ff;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── LINK CARD (for external sites) ───────────────── */
.link-card-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  padding: 60px;
  text-align: center;
  background: radial-gradient(ellipse at 50% 30%, rgba(0,198,184,0.06) 0%, transparent 60%);
}

.link-card {
  background: var(--navy-card);
  border: 1px solid var(--navy-border);
  border-radius: 16px;
  padding: 32px 40px;
  max-width: 440px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.link-card:hover {
  border-color: var(--um-teal);
  box-shadow: 0 4px 24px rgba(0,198,184,0.1);
}

.link-card-icon { font-size: 40px; }

.link-card-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
}

.link-card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.link-card-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--um-teal), var(--um-blue-mid));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 24px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: opacity 0.15s;
  margin-top: 4px;
}

.link-card-btn:hover { opacity: 0.88; }

/* ── CONTENT PAGE (pipeline tool etc) ─────────────── */
.content-page {
  flex: 1;
  overflow: hidden;
  position: relative;
}

html,body{height:100vh;width:100vw;overflow:hidden;margin:0;padding:0;}
body{display:flex;flex-direction:row;background:#0d1b2e;}
#sidebar-container{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:200;}
#main{margin-left:230px;width:calc(100vw - 230px);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:linear-gradient(135deg,#1b3f6e,#0d1b2e);border-bottom:1px solid #1c3250;}
.page-body{flex:1;overflow:hidden;position:relative;width:100%;}
.page-body iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.page-body .link-card-page,.page-body .coming-soon-page{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:40px;overflow-y:auto;}
.chat-bubble{position:fixed;bottom:24px;right:24px;z-index:1000;display:none;}
.chat-bubble.visible{display:block;}
.chat-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00c6b8,#2a7de1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(0,198,184,0.35);transition:transform .15s;}
.chat-fab:hover{transform:scale(1.08);}
.chat-popup{display:none;position:absolute;bottom:64px;right:0;width:280px;background:#132035;border:1px solid #1c3250;border-radius:16px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,0.4);text-align:center;}
.chat-popup.open{display:block;animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.chat-popup-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:"Syne",sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:12px;}

/* ── LOGIN ── */
#login-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#0a1520 0%,#0d1b2e 50%,#1b3f6e 100%);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0;}
.login-card{background:#132035;border:1px solid #1c3250;border-radius:20px;padding:40px 44px;width:100%;max-width:420px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
.login-logo{font-family:"Syne",sans-serif;font-size:22px;font-weight:800;color:#fff;margin-bottom:4px;}
.login-logo span{background:linear-gradient(135deg,#00c6b8,#2a7de1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-sub{font-size:11px;color:#3a5570;margin-bottom:28px;letter-spacing:0.04em;}
.login-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,198,184,0.1);border:1px solid rgba(0,198,184,0.2);border-radius:20px;padding:4px 12px;font-size:10px;font-weight:700;color:#00c6b8;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:24px;}
.login-field{width:100%;background:#0d1b2e;border:1px solid #1c3250;border-radius:10px;padding:12px 16px;color:#f0f4f8;font-family:"DM Sans",sans-serif;font-size:13px;outline:none;margin-bottom:12px;transition:border-color .2s;text-align:left;}
.login-field:focus{border-color:#00c6b8;}
.login-field::placeholder{color:#3a5570;}
.login-btn{width:100%;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:13px;font-family:"Syne",sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s;letter-spacing:0.02em;}
.login-btn:hover{opacity:.88;}
.login-error{font-size:12px;color:#e57373;margin-top:10px;min-height:18px;}
.login-footer{font-size:10px;color:#2e4a62;margin-top:20px;}

@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
</style>
</head>

    <div class="login-sub">Internal Tools Platform</div>
    <div class="login-badge"><div style="width:6px;height:6px;border-radius:50%;background:#00c6b8;animation:pulse 2s infinite;"></div> Secured Access</div>

<div id="sidebar-container"></div>
<div id="main"></div>

</div>
<script>

// ── AUTH ──────────────────────────────────────────────────────────────────────
const AUTH_PASSWORD = "UMtech2026!";
const SESSION_KEY = "umtech_auth";

function checkAuth(){
  const auth = sessionStorage.getItem(SESSION_KEY);
  if(auth === "true"){
    document.getElementById("login-screen").style.display = "none";
  }
}

function attemptLogin(){
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");

  if(!email.endsWith("@umortgage.com")){
    err.textContent = "Must use a @umortgage.com email address.";
    shake();
    return;
  }
  if(pass !== AUTH_PASSWORD){
    err.textContent = "Incorrect password. Try again.";
    shake();
    return;
  }
  sessionStorage.setItem(SESSION_KEY, "true");
  document.getElementById("login-screen").style.display = "none";
  err.textContent = "";
}

function shake(){
  const card = document.querySelector(".login-card");
  card.style.animation = "shake .4s ease";
  setTimeout(()=>card.style.animation="",400);

const _cache={};
function getBlobURL(key){
  if(!_cache[key]){
    const bin=atob(TOOLS[key]);const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    _cache[key]=URL.createObjectURL(new Blob([bytes],{type:"text/html"}));
  }
  return _cache[key];
}
function toggleChat(){document.getElementById("chatPopup").classList.toggle("open");}
document.addEventListener("click",e=>{const b=document.getElementById("chatBubble");if(b&&!b.contains(e.target))document.getElementById("chatPopup").classList.remove("open");});

const NAV=[
  {section:"UMortgage Tools",items:[
    {id:"onboarding",icon:"🗺️",label:"Onboarding Journey",type:"tool",toolKey:"onboarding",badge:"BETA",theme:"light"},
    {id:"community", icon:"👥",label:"UMortgage Community",type:"linkcard",url:"https://www.facebook.com/groups/umortgage",desc:"Join the UMortgage Facebook community — connect with teammates, share wins, and stay in the loop.",btnLabel:"Open Community",theme:"light"},
    {id:"arive",     icon:"📋",label:"ARIVE",type:"iframe",url:"https://umortgage.myarive.com/",theme:"light"},
    {id:"tempo",     icon:"🎯",label:"Tempo",type:"iframe",url:"https://tempo.umortgage.com/",theme:"light"},
  ]},
  {section:"Ops AI Tools",items:[
    {id:"closing",    icon:"📅",label:"Closing Engine",type:"soon",desc:"AI-powered closing timeline generator built around your target close date.",theme:"dark"},
    {id:"turntimes",  icon:"⏱", label:"Turn Times",type:"soon",desc:"Real-time lender turn time tracking. See current UW turn times by lender, updated daily.",theme:"dark"},
    {id:"pipeline",   icon:"📊",label:"Daily Processing Report",type:"tool",toolKey:"pipeline",theme:"light",showChat:true},
    {id:"leaderboard",icon:"🏆",label:"Experience is Everything",type:"soon",desc:"The UMortgage Experience Leaderboard is coming soon. Rankings, points, and performance — all in one place.",theme:"dark"},
  ]}
];

function buildSidebar(activeId){
  const navHtml=NAV.map(s=>{
    const items=s.items.map(item=>`<div class="nav-item ${item.id===activeId?"active":""}" onclick="navigate('${item.id}')" data-id="${item.id}">
      <span class="nav-icon">${item.icon}</span><span class="nav-label-text">${item.label}</span>
      ${item.badge?'<span class="beta-pill">'+item.badge+"</span>":""}
      ${item.type==="soon"?'<span class="beta-pill" style="background:rgba(240,165,0,0.15);color:#f0a500;">SOON</span>':""}
    </div>`).join("");
    return `<div class="nav-section-label">${s.section}</div>${items}<div class="nav-divider"></div>`;
  }).join("");
  return `<div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge"><div class="logo-pulse"></div><span>AI Powered</span></div>
      <div class="sidebar-title">UMortgage <span class="ai">AI</span> Tech</div>
      <div class="sidebar-sub">Internal Tools Platform</div>
    </div>
    <nav class="sidebar-nav">${navHtml}</nav>
    <div class="sidebar-footer">
      <a class="footer-credit" href="https://en.wikipedia.org/wiki/Michael_Jordan" target="_blank">🐐 Employee #23 Built This</a>
    </div>
  </div>`;
}

function buildPage(item){
  const topbar=`<div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:16px;">${item.icon}</span>
      <span style="font-family:Syne,sans-serif;font-size:14px;font-weight:700;color:#fff;">${item.label}</span>
      ${item.badge?'<span class="topbar-badge">'+item.badge+"</span>":""}
      ${item.type==="soon"?'<span class="topbar-badge" style="color:#f0a500;border-color:rgba(240,165,0,0.3);">Coming Soon</span>':""}
    </div>
    <div style="display:flex;align-items:center;gap:10px;"><span class="topbar-badge">UMortgage AI Tech</span></div>
  </div>`;

  const bubble=document.getElementById("chatBubble");
  if(bubble)bubble.className="chat-bubble"+(item.showChat?" visible":"");

  if(item.type==="iframe")return topbar+`<div class="page-body" style="background:#f4f6f9;"><iframe src="${item.url}" allow="fullscreen" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div>`;

  if(item.type==="linkcard")return topbar+`<div class="page-body" style="background:#f4f6f9;"><div class="link-card-page">
    <div style="max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:32px 36px;box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <div style="font-size:48px;margin-bottom:12px;">${item.icon}</div>
      <div style="font-family:Syne,sans-serif;font-size:20px;font-weight:800;color:#1a2b3c;margin-bottom:8px;">${item.label}</div>
      <div style="font-size:13px;color:#7a92a8;margin-bottom:20px;line-height:1.6;">${item.desc}</div>
      <a style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:11px 24px;font-family:Syne,sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;" href="${item.url}" target="_blank">${item.btnLabel} ↗</a>
    </div>
  </div></div>`;

  if(item.type==="soon")return topbar+`<div class="page-body" style="background:#0d1b2e;"><div class="coming-soon-page">
    <div style="font-size:52px;">${item.icon}</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(240,165,0,0.12);border:1px solid rgba(240,165,0,0.3);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;color:#f0a500;letter-spacing:0.08em;text-transform:uppercase;">🔜 Coming Soon</div>
    <div style="font-family:Syne,sans-serif;font-size:28px;font-weight:800;color:#fff;">${item.label}</div>
    <div style="font-size:14px;color:#7a9ab8;max-width:400px;line-height:1.6;text-align:center;">${item.desc}</div>
  </div></div>`;

  if(item.type==="tool")return topbar+`<div class="page-body" style="background:#f4f6f9;"><iframe src="${getBlobURL(item.toolKey)}"></iframe></div>`;
  return topbar;
}

function navigate(id){
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===id);
  if(!item)return;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  document.getElementById("main").innerHTML=buildPage(item);
  document.title=item.label+" · UMortgage AI Tech";
  try{history.pushState({id},"","#"+id);}catch(e){}
}

function initApp(){
  const hash=window.location.hash.replace("#","")||"onboarding";
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===hash)||allItems[0];
  document.getElementById("sidebar-container").innerHTML=buildSidebar(item.id);
  document.getElementById("main").innerHTML=buildPage(item);
  document.title=item.label+" · UMortgage AI Tech";
}

window.addEventListener("popstate",e=>{if(e.state&&e.state.id)navigate(e.state.id);});
document.addEventListener("DOMContentLoaded",()=>{checkAuth();initApp();});
</script>
