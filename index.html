<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UMortgage AI Tech</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00c6b8;--teal-dim:#00a89b;--blue:#2a7de1;--navy:#0d1b2e;--um-blue:#1b3f6e;--um-blue-mid:#1e4d87;
  --navy-card:#132035;--navy-border:#1c3250;--sidebar-w:230px;
  --text:#f0f4f8;--muted:#7a9ab8;--faint:#2a4060;
  --red:#c0392b;--amber:#e07b00;--green:#1a7a4a;--yellow:#f5c518;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100vh;width:100vw;overflow:hidden;}
body{font-family:"DM Sans",sans-serif;display:flex;flex-direction:row;background:#f4f6f9;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,#1b3f6e 0%,#0d2744 100%);display:flex;flex-direction:column;z-index:200;}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.1);}
.logo-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border-radius:6px;padding:3px 8px;margin-bottom:8px;}
.logo-badge span{font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;}
.logo-pulse{width:6px;height:6px;border-radius:50%;background:#00c6b8;animation:pulse 2s infinite;}
.sidebar-title{font-family:"Syne",sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.2;}
.sidebar-title .ai{background:linear-gradient(135deg,#00c6b8,#4db8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.35);padding:0 8px;margin:14px 0 6px;}
.nav-section-label:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);cursor:pointer;transition:all .15s;margin-bottom:2px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;}
.nav-item.active::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;background:#00c6b8;border-radius:0 3px 3px 0;}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-label-text{flex:1;}
.beta-pill{font-size:8px;font-weight:700;letter-spacing:.07em;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);border-radius:4px;padding:1px 5px;text-transform:uppercase;}
.soon-pill{font-size:8px;font-weight:700;letter-spacing:.07em;background:rgba(240,165,0,0.2);color:#f0a500;border-radius:4px;padding:1px 5px;text-transform:uppercase;}
.nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:8px 10px;}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.08);}
.footer-credit{font-size:10px;color:rgba(255,255,255,0.3);cursor:pointer;transition:color .15s;text-decoration:none;display:block;}
.footer-credit:hover{color:rgba(255,255,255,0.7);}

/* MAIN */
#main{margin-left:230px;width:calc(100vw - 230px);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{flex-shrink:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:linear-gradient(135deg,#1b3f6e,#0d2744);border-bottom:1px solid rgba(255,255,255,0.1);}
.topbar-badge{font-size:11px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 11px;}
.page-body{flex:1;overflow:hidden;position:relative;width:100%;}
.page-body iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.page-body .link-card-page,.page-body .coming-soon-page{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:40px;overflow-y:auto;}

/* CHAT BUBBLE */
.chat-bubble{position:fixed;bottom:24px;right:24px;z-index:1000;display:none;}
.chat-bubble.visible{display:block;}
.chat-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00c6b8,#2a7de1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(0,198,184,.35);transition:transform .15s;}
.chat-fab:hover{transform:scale(1.08);}
.chat-popup{display:none;position:absolute;bottom:64px;right:0;width:280px;background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center;}
.chat-popup.open{display:block;animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.chat-popup-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:Syne,sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:12px;}
</style>
</head>
<body>

<div id="login-screen" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#e8f0f8,#f0f4f9,#daeaf7);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div class="login-card" style="background:#fff;border:1px solid #dde3ec;border-radius:20px;padding:40px 44px;width:100%;max-width:420px;text-align:center;box-shadow:0 24px 64px rgba(27,63,110,0.12);">
    <div style="font-size:36px;margin-bottom:12px;">🏠</div>
    <div style="font-family:Syne,sans-serif;font-size:22px;font-weight:800;color:#1a2b3c;margin-bottom:4px;">UMortgage <span style="background:linear-gradient(135deg,#00c6b8,#2a7de1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">AI</span> Tech</div>
    <div style="font-size:11px;color:#7a92a8;margin-bottom:24px;letter-spacing:0.04em;">Internal Tools Platform</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,198,184,0.08);border:1px solid rgba(0,198,184,0.2);border-radius:20px;padding:4px 12px;font-size:10px;font-weight:700;color:#00c6b8;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:24px;"><div style="width:6px;height:6px;border-radius:50%;background:#00c6b8;animation:pulse 2s infinite;"></div> Secured Access</div>
    <input style="width:100%;background:#f4f6f9;border:1px solid #dde3ec;border-radius:10px;padding:12px 16px;color:#1a2b3c;font-family:DM Sans,sans-serif;font-size:13px;outline:none;margin-bottom:12px;transition:border-color .2s;display:block;" type="email" id="loginEmail" placeholder="kallen@umortgage.com" autocomplete="email" onfocus="this.style.borderColor='#00c6b8'" onblur="this.style.borderColor='#dde3ec'"/>
    <input style="width:100%;background:#f4f6f9;border:1px solid #dde3ec;border-radius:10px;padding:12px 16px;color:#1a2b3c;font-family:DM Sans,sans-serif;font-size:13px;outline:none;margin-bottom:12px;transition:border-color .2s;display:block;" type="password" id="loginPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')attemptLogin()" onfocus="this.style.borderColor='#00c6b8'" onblur="this.style.borderColor='#dde3ec'"/>
    <button onclick="attemptLogin()" style="width:100%;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:13px;font-family:Syne,sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s;">Access Platform →</button>
    <div id="loginError" style="font-size:12px;color:#e57373;margin-top:10px;min-height:18px;"></div>
    <div style="font-size:10px;color:#a0b0c0;margin-top:16px;">UMortgage employees only · @umortgage.com required</div>
  </div>
</div>

<div id="sidebar-container"></div>
<div id="main"></div>
<div class="chat-bubble" id="chatBubble">
  <div class="chat-popup" id="chatPopup">
    <div style="font-size:32px;margin-bottom:8px;">🤖</div>
    <div style="font-family:Syne,sans-serif;font-size:15px;font-weight:800;color:#1a2b3c;margin-bottom:6px;">Chat UWM</div>
    <div style="font-size:11px;color:#7a92a8;line-height:1.5;">Your AI assistant for UMortgage questions and support.</div>
    <a class="chat-popup-btn" href="https://chatuwm.com/" target="_blank">Open Chat ↗</a>
  </div>
  <button class="chat-fab" onclick="toggleChat()">💬</button>
</div>
<script>

const AUTH_PASSWORD = "UMtech2026!";
const SESSION_KEY = "umtech_auth";
function checkAuth(){
  const auth=sessionStorage.getItem(SESSION_KEY);
  if(auth==="true") document.getElementById("login-screen").style.display="none";
}
function attemptLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass=document.getElementById("loginPass").value;
  const err=document.getElementById("loginError");
  if(!email.endsWith("@umortgage.com")){err.textContent="Must use a @umortgage.com email address.";shakeCard();return;}
  if(pass!==AUTH_PASSWORD){err.textContent="Incorrect password. Try again.";shakeCard();return;}
  sessionStorage.setItem(SESSION_KEY,"true");
  document.getElementById("login-screen").style.display="none";
  err.textContent="";
}
function shakeCard(){
  const c=document.querySelector(".login-card");
  c.style.animation="shake .4s ease";
  setTimeout(()=>c.style.animation="",400);
}

const _cache={};
function getBlobURL(key){if(!_cache[key]){const bin=atob(TOOLS[key]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);_cache[key]=URL.createObjectURL(new Blob([bytes],{type:"text/html"}));}return _cache[key];}
function toggleChat(){document.getElementById("chatPopup").classList.toggle("open");}
document.addEventListener("click",e=>{const b=document.getElementById("chatBubble");if(b&&!b.contains(e.target))document.getElementById("chatPopup").classList.remove("open");});

function buildSidebar(activeId){
  const navHtml=NAV.map(s=>{
    const items=s.items.map(item=>`<div class="nav-item ${item.id===activeId?"active":""}" onclick="navigate('${item.id}')" data-id="${item.id}">
      <span class="nav-icon">${item.icon}</span><span class="nav-label-text">${item.label}</span>
      ${item.badge?'<span class="beta-pill">'+item.badge+"</span>":""}
      ${item.type==="soon"?'<span class="soon-pill">SOON</span>':""}
    </div>`).join("");
    return `<div class="nav-section-label">${s.section}</div>${items}<div class="nav-divider"></div>`;
  }).join("");
  return `<div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge"><div class="logo-pulse"></div><span>AI Powered</span></div>
      <div class="sidebar-title">UMortgage <span class="ai">AI</span> Tech</div>
      <div class="brand-sub">Internal Tools Platform</div>
    </div>
    <nav class="sidebar-nav">${navHtml}</nav>
    <div class="sidebar-footer">
      <a class="footer-credit" href="https://en.wikipedia.org/wiki/Michael_Jordan" target="_blank">🐐 Employee #23 Built This</a>
    </div>
  </div>`;
}

function buildPage(item){
  const topbar=`<div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:16px;">${item.icon}</span>
      <span style="font-family:Syne,sans-serif;font-size:14px;font-weight:700;color:#fff;">${item.label}</span>
      ${item.badge?'<span class="topbar-badge">'+item.badge+"</span>":""}
      ${item.type==="soon"?'<span class="topbar-badge" style="color:#f0a500;border-color:rgba(240,165,0,.3);">Coming Soon</span>':""}
    </div>
    <div style="display:flex;align-items:center;gap:10px;"><span class="topbar-badge">UMortgage AI Tech</span></div>
  </div>`;
  const bubble=document.getElementById("chatBubble");
  if(bubble)bubble.className="chat-bubble"+(item.showChat?" visible":"");
  if(item.type==="iframe")return topbar+`<div class="page-body" style="background:#f4f6f9;"><iframe src="${item.url}" allow="fullscreen" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div>`;
  if(item.type==="linkcard")return topbar+`<div class="page-body" style="background:#f4f6f9;"><div class="link-card-page">
    <div style="max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:32px 36px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
      <div style="font-size:48px;margin-bottom:12px;">${item.icon}</div>
      <div style="font-family:Syne,sans-serif;font-size:20px;font-weight:800;color:#1a2b3c;margin-bottom:8px;">${item.label}</div>
      <div style="font-size:13px;color:#7a92a8;margin-bottom:20px;line-height:1.6;">${item.desc}</div>
      <a style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#00c6b8,#2a7de1);color:#fff;border:none;border-radius:10px;padding:11px 24px;font-family:Syne,sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;" href="${item.url}" target="_blank">${item.btnLabel} ↗</a>
    </div>
  </div></div>`;
  if(item.type==="soon")return topbar+`<div class="page-body" style="background:#0d1b2e;"><div class="coming-soon-page">
    <div style="font-size:52px;">${item.icon}</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(240,165,0,.12);border:1px solid rgba(240,165,0,.3);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;color:#f0a500;letter-spacing:.08em;text-transform:uppercase;">🔜 Coming Soon</div>
    <div style="font-family:Syne,sans-serif;font-size:28px;font-weight:800;color:#fff;">${item.label}</div>
    <div style="font-size:14px;color:#7a9ab8;max-width:400px;line-height:1.6;text-align:center;">${item.desc}</div>
  </div></div>`;
  if(item.type==="tool")return topbar+`<div class="page-body" style="background:#f4f6f9;"><iframe src="${getBlobURL(item.toolKey)}"></iframe></div>`;
  return topbar;
}

function navigate(id){
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===id);
  if(!item)return;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  document.getElementById("main").innerHTML=buildPage(item);
  document.title=item.label+" · UMortgage AI Tech";
  try{history.pushState({id},"","#"+id);}catch(e){}
}

function initApp(){
  const hash=window.location.hash.replace("#","")||"onboarding";
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===hash)||allItems[0];
  document.getElementById("sidebar-container").innerHTML=buildSidebar(item.id);
  document.getElementById("main").innerHTML=buildPage(item);
  document.title=item.label+" · UMortgage AI Tech";
}

window.addEventListener("popstate",e=>{if(e.state&&e.state.id)navigate(e.state.id);});
document.addEventListener("DOMContentLoaded",()=>{checkAuth();initApp();});
</script>
</body>
</html>
