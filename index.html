<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UMortgage AI Tech</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap');

:root {
  --um-blue: #1b3f6e;
  --um-blue-mid: #1e4d87;
  --um-teal: #00c6b8;
  --um-teal-dim: #00a89b;
  --um-gold: #f0a500;
  --navy: #0d1b2e;
  --navy-card: #132035;
  --navy-border: #1c3250;
  --sidebar-w: 230px;
  --text: #f0f4f8;
  --muted: #7a9ab8;
  --faint: #2a4060;
  --red: #c0392b;
  --amber: #e07b00;
  --green: #1a7a4a;
  --yellow: #f5c518;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--navy);
  color: var(--text);
  height: 100vh;
  display: flex;
}

/* ── SIDEBAR ───────────────────────────────────────── */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0a1520 0%, #0d1b2e 100%);
  border-right: 1px solid var(--navy-border);
  display: flex;
  flex-direction: column;
  z-index: 200;
  overflow: hidden;
}

.sidebar::before {
  content: '';
  position: absolute;
  top: -60px; left: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(0,198,184,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--navy-border);
  position: relative;
}

.logo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--um-teal), var(--um-blue-mid));
  border-radius: 6px;
  padding: 3px 8px;
  margin-bottom: 8px;
}

.logo-badge span {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
}

.logo-pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.sidebar-title {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.sidebar-title .ai {
  background: linear-gradient(135deg, var(--um-teal), #4db8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.03em;
}

/* NAV */
.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  overflow-y: auto;
}

.nav-section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 0 10px;
  margin: 14px 0 6px;
}

.nav-section-label:first-child { margin-top: 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 1px;
  text-decoration: none;
  position: relative;
  user-select: none;
}

.nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

.nav-item.active {
  background: rgba(0,198,184,0.1);
  color: var(--um-teal);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: var(--um-teal);
  border-radius: 0 3px 3px 0;
}

.nav-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label-text { flex: 1; }

.beta-pill {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: rgba(42,125,225,0.18);
  color: #4db8ff;
  border-radius: 4px;
  padding: 1px 5px;
  text-transform: uppercase;
}

.nav-divider {
  height: 1px;
  background: var(--navy-border);
  margin: 10px 10px;
}

/* SIDEBAR FOOTER */
.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--navy-border);
}

.footer-credit {
  font-size: 10px;
  color: var(--faint);
  cursor: pointer;
  transition: color 0.15s;
  text-decoration: none;
  display: block;
}

.footer-credit:hover { color: var(--um-teal); }

/* ── MAIN AREA ─────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: linear-gradient(135deg, var(--um-blue) 0%, var(--navy) 100%);
  border-bottom: 1px solid var(--navy-border);
  padding: 0 28px;
  height: 52px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  flex-shrink: 0;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-page-title {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.01em;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-badge {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 3px 11px;
}

/* ── IFRAME PAGES ──────────────────────────────────── */
.iframe-container {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.iframe-container iframe,
.content-page iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ── BETA / COMING SOON PAGE ───────────────────────── */
.placeholder-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 60px;
  text-align: center;
}

.placeholder-icon { font-size: 48px; margin-bottom: 8px; }

.placeholder-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}

.placeholder-sub {
  font-size: 14px;
  color: var(--muted);
  max-width: 400px;
  line-height: 1.6;
}

.beta-badge-big {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(42,125,225,0.15);
  border: 1px solid rgba(77,184,255,0.3);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  color: #4db8ff;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── LINK CARD (for external sites) ───────────────── */
.link-card-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  padding: 60px;
  text-align: center;
  background: radial-gradient(ellipse at 50% 30%, rgba(0,198,184,0.06) 0%, transparent 60%);
}

.link-card {
  background: var(--navy-card);
  border: 1px solid var(--navy-border);
  border-radius: 16px;
  padding: 32px 40px;
  max-width: 440px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.link-card:hover {
  border-color: var(--um-teal);
  box-shadow: 0 4px 24px rgba(0,198,184,0.1);
}

.link-card-icon { font-size: 40px; }

.link-card-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
}

.link-card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.link-card-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--um-teal), var(--um-blue-mid));
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 24px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: opacity 0.15s;
  margin-top: 4px;
}

.link-card-btn:hover { opacity: 0.88; }

/* ── CONTENT PAGE (pipeline tool etc) ─────────────── */
.content-page {
  flex: 1;
  overflow: hidden;
  position: relative;
}

html,body{height:100vh;width:100vw;overflow:hidden;margin:0;padding:0;}
body{display:flex;flex-direction:row;}
[data-theme="light"]{--sb-bg:#0d1b2e;--sb-border:rgba(255,255,255,.06);--sb-text:#b8cad8;--sb-muted:#3a5570;--top-bg:#1b3f6e;--top-border:#1c3250;--page-bg:#f4f6f9;}
[data-theme="dark"]{--sb-bg:#0a1520;--sb-border:rgba(255,255,255,.04);--sb-text:#7a92a8;--sb-muted:#2e4a62;--top-bg:#0a1520;--top-border:#1e3a55;--page-bg:#0d1b2e;}
#sidebar-container{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:200;}
#main{margin-left:230px;width:calc(100vw - 230px);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{flex-shrink:0;background:linear-gradient(135deg,var(--um-blue),var(--navy));}
.page-body{flex:1;overflow:hidden;position:relative;width:100%;background:var(--page-bg);}
.page-body iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.page-body .link-card-page,.page-body .placeholder-page{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:40px;overflow-y:auto;}

/* CHAT BUBBLE */
.chat-bubble{position:fixed;bottom:24px;right:24px;z-index:1000;}
.chat-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--um-teal),var(--um-blue-mid));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(0,198,184,0.35);transition:transform .15s,box-shadow .15s;}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(0,198,184,0.45);}
.chat-popup{display:none;position:absolute;bottom:64px;right:0;width:300px;background:var(--navy-card);border:1px solid var(--navy-border);border-radius:16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.3);text-align:center;}
.chat-popup.open{display:block;animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.chat-popup-icon{font-size:36px;margin-bottom:10px;}
.chat-popup-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff;margin-bottom:6px;}
.chat-popup-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.chat-popup-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--um-teal),var(--um-blue-mid));color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .15s;}
.chat-popup-btn:hover{opacity:.88;}

/* THEME TOGGLE */
.theme-toggle-btn{background:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px;color:#fff;transition:all .15s;}
.theme-toggle-btn:hover{border-color:var(--um-teal);}
</style>
</head>

(()=>{const t=localStorage.getItem('umtech_theme')||'light';document.body.setAttribute('data-theme',t);})();
function toggleTheme(){
  const cur=document.body.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.body.setAttribute('data-theme',next);
  localStorage.setItem('umtech_theme',next);
  document.querySelectorAll('.theme-toggle-btn').forEach(b=>b.textContent=next==='dark'?'☀️':'🌙');
}

const _cache={};
function getBlobURL(key){
  if(!_cache[key]){
    const bin=atob(TOOLS[key]);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    _cache[key]=URL.createObjectURL(new Blob([bytes],{type:'text/html'}));
  }
  return _cache[key];
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar(activeId){
  const navHtml=NAV.map(s=>{
    const items=s.items.map(item=>`
      <div class="nav-item ${item.id===activeId?'active':''}" onclick="navigate('${item.id}')" data-id="${item.id}">
        <span class="nav-icon">${item.icon}</span>
        <span class="nav-label-text">${item.label}</span>
        ${item.badge?'<span class="beta-pill">'+item.badge+'</span>':''}
        ${item.type==='soon'?'<span class="beta-pill" style="background:rgba(240,165,0,0.15);color:#f0a500;">SOON</span>':''}
      </div>`).join('');
    return `<div class="nav-section-label">${s.section}</div>${items}<div class="nav-divider"></div>`;
  }).join('');
  return `<div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge"><div class="logo-pulse"></div><span>AI Powered</span></div>
      <div class="sidebar-title">UMortgage <span class="ai">AI</span> Tech</div>
      <div class="sidebar-sub">Internal Tools Platform</div>
    </div>
    <nav class="sidebar-nav">${navHtml}</nav>
    <div class="sidebar-footer">
      <a class="footer-credit" href="https://en.wikipedia.org/wiki/Michael_Jordan" target="_blank">Employee #23 Built This 🐐</a>
    </div>
  </div>`;
}

function buildPage(item){
  const themeIcon=document.body.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  const topbar=`<div class="topbar" style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--navy-border);">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:16px;">${item.icon}</span>
      <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#fff;">${item.label}</span>
      ${item.badge?'<span class="topbar-badge">'+item.badge+'</span>':''}
      ${item.type==='soon'?'<span class="topbar-badge" style="color:#f0a500;border-color:rgba(240,165,0,0.3);">Coming Soon</span>':''}
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle-btn" onclick="toggleTheme()">${themeIcon}</button>
      <span class="topbar-badge">UMortgage AI Tech</span>
    </div>
  </div>`;

  if(item.type==='linkcard'){
    return topbar+`<div class="page-body"><div class="link-card-page">
      <div class="link-card" style="max-width:420px;width:100%;text-align:center;">
        <div style="font-size:48px;margin-bottom:12px;">${item.icon}</div>
        <div class="link-card-title">${item.label}</div>
        <div class="link-card-desc" style="margin:10px 0 20px;">${item.desc}</div>
        <a class="link-card-btn" href="${item.url}" target="_blank">${item.btnLabel} ↗</a>
      </div>
    </div></div>`;
  }
  if(item.type==='soon'){
    return topbar+`<div class="page-body"><div class="placeholder-page">
      <div style="font-size:48px;">${item.icon}</div>
      <div class="beta-badge-big" style="background:rgba(240,165,0,0.12);border-color:rgba(240,165,0,0.3);color:#f0a500;">🔜 Coming Soon</div>
      <div class="placeholder-title">${item.label}</div>
      <div class="placeholder-sub">${item.desc}</div>
    </div></div>`;
  }
  if(item.type==='tool'){
    return topbar+`<div class="page-body"><iframe src="${getBlobURL(item.toolKey)}"></iframe></div>`;
  }
  return topbar;
}

// ── NAVIGATE ──────────────────────────────────────────────────────────────────
function navigate(id){
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===id);
  if(!item)return;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  document.getElementById('main').innerHTML=buildPage(item);
  document.title=item.label+' · UMortgage AI Tech';
  try{history.pushState({id},'','#'+id);}catch(e){}
}

function initApp(){
  const hash=window.location.hash.replace('#','')||'home';
  const allItems=NAV.flatMap(s=>s.items);
  const item=allItems.find(i=>i.id===hash)||allItems[0];
  document.getElementById('sidebar-container').innerHTML=buildSidebar(item.id);
  document.getElementById('main').innerHTML=buildPage(item);
  document.title=item.label+' · UMortgage AI Tech';
}

window.addEventListener('popstate',e=>{if(e.state&&e.state.id)navigate(e.state.id);});
document.addEventListener('DOMContentLoaded',initApp);
</script>
</body>
</html>
